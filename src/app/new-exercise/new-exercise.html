<main class="screen">
  <div class="toolbar">
    <a
      tuiIconButton
      [routerLink]="back()"
      appearance="secondary-grayscale"
      iconStart="@tui.chevron-left"
      size="m"
      class="back"
    >
      Back
    </a>
  </div>

  <h1>New exercise</h1>

  <app-exercise-form [(name)]="exerciseName" [(muscles)]="muscles" />

  <div class="actions">
    <button tuiButton type="button" size="l" class="main" [disabled]="!valid()" (click)="save()">
      @if (id()) {
        Add to {{ session()?.date | date: 'EEE d MMM' }}
      } @else {
        Add to today
      }
    </button>
  </div>
</main>
